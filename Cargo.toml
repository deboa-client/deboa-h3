[package]
name = "deboa-h3"
version = "0.1.2"
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/deboa-h3"
homepage = "https://github.com/ararog/deboa"
description = "H3 support for deboa"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "client", "fetch", "rest-client"]
rust-version = "1.85.0"

[features]
default = []
generic = ["dep:h3", "dep:h3-quinn", "hyper-body-utils/generic-h3", "hyper-body-utils/generic"]
compio = ["dep:h3", "dep:compio-quic", "hyper-body-utils/compio-h3", "hyper-body-utils/compio"]

[dependencies]
bytes = { version = "1.11" }
compio-quic = { version = "0.8.0", optional = true, default-features = false }
deboa = { version = "0.1.3" }
h3 = { version = "0.0.8", optional = true, default-features = false }
h3-quinn = { version = "0.0.10", optional = true, default-features = false }
http = "1"
http-body-util = "0.1"
hyper-body-utils = { version = ">= 0.1.14", default-features = false }
